[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[gcode_macro SPOOLMAN_CONFIG]
variable_tools: 5
gcode:
  G0

[gcode_macro SPOOLMAN_TOOL_SYNC]
gcode:
  {% set tool = params.TOOL|default(-1)|int %}
  {% if tool == -1 %}
    {% set tool = printer.trad_rack.active_lane %}
  {% endif %}
  {% if tool|string == "None" %}
    {% set tool = -1 %}
    RESPOND TYPE=echo MSG="Spoolman > Tool Sync > Tool converted from None to -1"
  {% endif %}
  {% if tool == -1 %}
    RESPOND TYPE=echo MSG="Spoolman > Tool Sync > No tool means no active spool"
    CLEAR_ACTIVE_SPOOL
  {% else %}
    {% set spool_id = printer['gcode_macro T' + tool|string]['spool_id']|default(-1)|int %}
    RESPOND TYPE=echo MSG="Spoolman > Tool Sync > Tool is {tool} and spool is {spool_id}"
    {% if spool_id > 0 %}
      RESPOND TYPE=echo MSG="Spoolman > Tool Sync > Setting active spool id to {spool_id}"
      SET_ACTIVE_SPOOL ID={spool_id}
    {% else %}
      CLEAR_ACTIVE_SPOOL
    {% endif %}
  {% endif %}

[gcode_macro SPOOLMAN_STARTUP_TRAD_RACK]
gcode:
   {% set tool = printer.trad_rack.active_lane %}
   {% if tool|string == 'None' %}
     {% set tool = -1 %}
   {% endif %}
   RESPOND TYPE=echo MSG="Spoolman > Startup TR > Current tool is {tool} (in memory)"
   {% if tool == -1 %}
     {% set svv = printer.save_variables.variables %}
     {% set tool = svv.tr_active_lane %}
     RESPOND TYPE=echo MSG="Spoolman > Startup TR > Current tool in variables is {tool}"
   {% endif %}
   {% if tool|string == 'None' %}
     {% set tool = -1 %}
   {% endif %}
   {% if tool > -1 %}
     RESPOND TYPE=echo MSG="Spoolman > Startup TR > Using {tool} as active tool for identifying spool id"
     SPOOLMAN_TOOL_SYNC TOOL={tool}
   {% else %}
     RESPOND TYPE=echo MSG="Spoolman > Startup TR > Clearing active spool"
     SPOOLMAN_TOOL_SYNC
   {% endif %}

[gcode_macro SPOOLMAN_LIST]
gcode:
  {% set ntools = printer['gcode_macro SPOOLMAN_CONFIG'].tools %}
  {% for index in range(0,ntools) %}
    RESPOND TYPE=echo MSG="SPOLLMAN List > Tool {index} has spoolman id {printer['gcode_macro T'+index|string].spool_id}"
  {% endfor %}

[gcode_macro SPOOLMAN_CONFIG]
gcode:
  {% set spool = params.SPOOL|default(-1)|int %}
  {% set tool = params.TOOL|default(-1)|int %}
  {% if spool > -2 and tool > -1 %}
    {% if spool == 0 %}
      {% set spool = -1 %}
    {% endif %}
    RESPOND TYPE=echo MSG="Setting spool {spool} in tool {tool}"
    SET_GCODE_VARIABLE MACRO=T{tool} VARIABLE=spool_id VALUE={spool}
    SAVE_VARIABLE VARIABLE=spoolman_spool_id_{tool} VALUE={spool}
  {% else %}
    RESPOND TYPE=error MSG="Setting spool {spool} in tool {tool} impossible, tool must be greater than -1 and spool must be -1 or greater than 0"
  {% endif %}

[delayed_gcode SPOOLMAN_LOAD_ON_STARTUP]
initial_duration: 4
gcode:
  RESPOND TYPE=echo MSG="Spoolman > Loading > Start..."
  {% set svv = printer.save_variables.variables %}

  {% set ntools = printer['gcode_macro SPOOLMAN_CONFIG'].tools %}
  RESPOND TYPE=echo MSG="Spoolman > Loading > There are {ntools} tools"
  {% set max = ntools %}
  {% if max < 0 %}
    {% set max = 0 %}
  {% endif %}
  
  {% for index in range(0,max) %}
    RESPOND TYPE=echo MSG="Spoolman > Loading > Slot {index}"
    
    {% set tmp = svv['spoolman_spool_id_' + index|string ]|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=T{index} VARIABLE=spool_id VALUE="{tmp}"
    RESPOND TYPE=echo MSG="Spoolman > Loading > Slot {index} > Spool id = {tmp}"
    
  {% endfor %}

  RESPOND TYPE=echo MSG="Spoolman > Loading > Configuring active spool (if already loaded in extruder)"
  SPOOLMAN_STARTUP_TRAD_RACK
  SPOOLMAN_LIST
  RESPOND TYPE=echo MSG="Spoolman > Loading > End"

  


  
