[gcode_macro T0]
variable_spool_id: -1
gcode:
  TR_LOAD_TOOLHEAD TOOL=0 {rawparams}

[gcode_macro T1]
variable_spool_id: -1
gcode:
  TR_LOAD_TOOLHEAD TOOL=1 {rawparams}

[gcode_macro T2]
variable_spool_id: -1
gcode:
  TR_LOAD_TOOLHEAD TOOL=2 {rawparams}

[gcode_macro T3]
variable_spool_id: -1
gcode:
  TR_LOAD_TOOLHEAD TOOL=3 {rawparams}

[gcode_macro T4]
variable_spool_id: -1
gcode:
  TR_LOAD_TOOLHEAD TOOL=4 {rawparams}
  
[delayed_gcode CURRENT_TOOL]
initial_duration: 1
gcode:
  RESPOND TYPE="echo" MSG="Macro > CURRENT_TOOL > Current tool is {printer.trad_rack.active_lane}"
